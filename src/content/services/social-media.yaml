        - { icon: quote, title: Je hebt geen tijd voor social media, text: Klanten en offertes gaan voor. Filmen schiet er altijd bij in. }
        - { icon: quote, title: Je post wel eens iets, maar er gebeurt niks, text: Drie likes, waarvan één van je moeder. }
        - { icon: quote, title: Je staat niet graag voor de camera, text: Zodra de camera loopt, klinkt het ineens stijf. }
        - { icon: quote, title: Je betaalde al eens voor content die niks opleverde, text: Mooie beelden, maar geen enkele nieuwe klant. }
